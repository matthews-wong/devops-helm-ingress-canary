{{- range $track := list "stable" "canary" }}
{{- if or (eq $track "stable") $.Values.canary.enabled }}
{{- $ctx := dict "root" $ "track" $track }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "canary-web.trackName" $ctx }}
  labels:
    {{- include "canary-web.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "canary-web.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
---
{{- end }}
{{- end }}
