{{- range $track := list "stable" "canary" }}
{{- if or (eq $track "stable") $.Values.canary.enabled }}
{{- $ctx := dict "root" $ "track" $track }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "canary-web.trackName" $ctx }}
  labels:
    {{- include "canary-web.labels" $ctx | nindent 4 }}
  {{- if eq $track "canary" }}
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: {{ $.Values.canary.weight | quote }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ $.Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "canary-web.trackName" $ctx }}
                port:
                  name: http
---
{{- end }}
{{- end }}
